<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- C33b · "Falta pouco mais de um mês" (28 s). Variação do C33 com gancho no calendário. -->
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="video.css"><link rel="stylesheet" href="../objecoes.css">
</head>
<body>
<script src="../luz.js"></script><script src="motor.js"></script><script src="historia.js"></script>
<script>
  window.DURACAO = 28.3; window.SEM_AUDIO = true;
  const PAGS = [['guia-p008', '3 cardápios, 8 a 10 pessoas'], ['guia-p012', 'Lista por seção'], ['guia-p022', 'Cronograma até dia 25']];
  document.body.insertAdjacentHTML('beforeend',
    cenaParede('par', COR.creme, boneco('bP', COR.cta, 900, 1000, 0.75) +
      `<div class="abs mao" id="par-q" style="left:880px;top:830px;font-size:150px;color:${COR.cta};z-index:4">?</div>`, [25]) +
    cenaMercado('merc', boneco('bM', COR.cta, 540, 1010, 0.95)) +
    cenaCalendario('cal') +
    cenaPDF('pdf', COR.creme, '', PAGS, '') +
    cenaCelular('cel', COR.creme, boneco('bC', COR.cta, 200, 960, 0.8)) +
    cenaOferta('of', 'Comprar agora') +
    titulo('t1', 'Já pensou na ceia?', { top: 300, tam: 110 }) +
    titulo('t2', 'A correria começa', { top: 300, tam: 110 }) +
    titulo('t3', 'Tudo no planejamento', { top: 300, tam: 104 }) +
    titulo('t4', 'Cardápio, lista e cronograma', { top: 290, tam: 96 }));
  document.querySelectorAll('.titulo-h').forEach(e => e.style.zIndex = 30);
  const S2 = 4.25, S3 = 9.15, S4 = 11.3, S5 = 17.85, S6 = 20.9;

  window.render = function (t) {
    // 1) calendário: novembro vira, 25 de dezembro marcado; a pergunta
    cena('#par', t, 0, S2, 0.01); camera('par', t, 0, S2, 1.0, 1.08, 0, 30);
    animaParede('par', t, 1.0);
    entra('#par-n25', t, 1.75, 1e9, { dy: 0, s0: 0.3, dur: 0.45, ease: E.back });
    entra('#par-q', t, 2.6, 1e9, { dy: 0, s0: 0.2, dur: 0.4, ease: E.back, rot: 10 });
    animaBoneco('bP', t, { olhar: -0.8, bE: 20 + 10 * Math.sin(t * 2), bD: 0, inclina: -5 + Math.sin(t * 1.5) * 3 });
    animaTitulo('t1', t, 2.33, S2 - 0.3);
    // 2) dia 23, mercado cheio
    cena('#merc', t, S2, S3, 0.01); camera('merc', t, S2, S3, 1.08, 1.0, -30, 0);
    animaBoneco('bM', t, { andar: t > 6.0 && t < 6.8 ? t : null, bE: 12, bD: 12, olhar: -0.6, inclina: t > 7.2 ? -6 : 0, fase: 1.3 });
    document.getElementById('merc-fila').style.transform = `translateX(${Math.sin(t * 1.3) * 6 + prog(t, 6.0, 6.8) * 20}px)`;
    entra('#merc-tag', t, 4.45, 1e9, { dy: 0, s0: 0.3, dur: 0.4, ease: E.back });
    animaTitulo('t2', t, 5.55, S3 - 0.3);
    faixa(t, S2, COR.cta, 'f1');
    // 3) e se o plano já estivesse pronto
    cena('#cal', t, S3, S4, 0.01); camera('cal', t, S3, S4, 0.96, 1.04);
    animaCalendario('cal', t, S3 + 0.1, 0.11);
    animaTitulo('t3', t, S3 + 0.1, S4 - 0.3);
    faixa(t, S3, COR.verde, 'f2');
    // 4) cardápio, lista e cronograma
    cena('#pdf', t, S4, S5, 0.01); camera('pdf', t, S4, S5, 1.0, 1.1, 0, -20);
    animaPDF('pdf', t, [11.43, 14.15, 15.41], S4 + 0.1);
    animaTitulo('t4', t, S4 + 0.1, S5 - 0.3);
    faixa(t, S4, COR.pessego, 'f3');
    // 5) guarda no celular e abre dia 17
    cena('#cel', t, S5, S6, 0.01); camera('cel', t, S5, S6, 1.04, 1.0);
    entra('#cel-tel', t, S5 + 0.05, 1e9, { dy: 200, s0: 0.9, dur: 0.5, ease: E.back });
    entra('#cel-pdf', t, 18.0, 1e9, { dy: -300, s0: 1.6, dur: 0.5, ease: E.back });
    entra('#cel-toast', t, 18.66, 1e9, { dy: 40, s0: 0.8, dur: 0.35, ease: E.back });
    entra('#cel-dia', t, 19.32, 1e9, { dy: 0, s0: 0.3, dur: 0.4, ease: E.back, rot: -6 });
    animaBoneco('bC', t, { bD: 70, bE: 8, cel: 1, olhar: 0.6, fase: 0.9 });
    faixa(t, S5, COR.cta, 'f4');
    // 6) oferta
    animaOferta('of', t, S6, 21.01, 22.29, 24.0, 25.75);
    faixa(t, S6, COR.verde, 'f5');
  };
  window.render(0);
</script>
</body></html>
