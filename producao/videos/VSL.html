<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- VSL da página (85 s): dor, história, solução, o que vem no guia, bônus, garantia e oferta. Mesmo estilo e voz dos C33/C34. -->
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="video.css"><link rel="stylesheet" href="../objecoes.css">
</head>
<body>
<script src="../luz.js"></script><script src="motor.js"></script><script src="historia.js"></script>
<script>
  window.DURACAO = 85.6; window.SEM_AUDIO = true;
  const PAGS = [['guia-p031', '30 receitas de casa'], ['guia-p008', '3 cardápios, 8 a 10 pessoas'], ['guia-p012', 'Lista por seção do mercado']];
  document.body.insertAdjacentHTML('beforeend',
    cenaMercado('merc', boneco('bM', COR.cta, 540, 1010, 0.95)) +
    cenaLista('lista', COR.creme, boneco('bL', COR.cta, 250, 820, 0.95)) +
    cenaSala('sala', boneco('bS', COR.cta, 540, 822, 1)) +
    cenaParede('par', COR.creme, boneco('bP', COR.cta, 900, 1000, 0.75)) +
    cenaPDF('pdf', COR.creme, '', PAGS, '') +
    cenaGeladeira('gel', COR.creme, boneco('bG', COR.cta, 850, 830, 0.95)) +
    cenaBancada('ban', [['sobremesa', 'Sobremesa'], ['farofa', 'Farofa'], ['salpicao', 'Salpicão']]) +
    cenaCozinha('coz', COR.creme, boneco('bK', COR.cta, 560, 830, 0.95)) +
    cenaBancada('bon', [['jogo', 'Brincadeiras'], ['pote', 'Sobras'], ['moeda', 'Econômica']], COR.p100) +
    cenaCelular('cel', COR.creme, boneco('bC', COR.cta, 200, 960, 0.8)) +
    `<div class="cena" id="gar" style="background:${COR.verde}"><div class="cam" id="gar-cam" style="position:absolute;inset:0">
       <div class="abs" id="gar-ic" style="left:340px;top:700px">${icone('check', 400)}</div></div></div>` +
    cenaOferta('of', 'Quero o guia') +
    titulo('t1', 'Tudo na última hora', { top: 300, tam: 104 }) +
    titulo('t2', 'Quanto comprar?', { top: 300, tam: 110 }) +
    chip('q2', 'O forno não dá conta', 0, 0, { tam: 50, fundo: COR.cta }) +
    titulo('t3', 'O problema não é você', { top: 300, tam: 104 }) +
    titulo('t4', 'Cada coisa no seu dia', { top: 300, tam: 104 }) +
    titulo('t5', 'O que vem no guia', { top: 300, tam: 104 }) +
    titulo('t6', 'Do dia 17 ao 25', { top: 300, tam: 110 }) +
    titulo('t7', 'Dia 21', { top: 300, tam: 120 }) +
    titulo('t8', 'Dia 23: tudo adiantado', { top: 300, tam: 104 }) +
    titulo('t9', 'Dia 24, hora a hora', { top: 300, tam: 104 }) +
    titulo('t10', '+ 3 bônus', { top: 300, tam: 120 }) +
    titulo('t11', 'PDF de 63 páginas', { top: 300, tam: 104 }) +
    titulo('t12', '7 dias de garantia', { top: 300, tam: 110, cor: COR.papel }));
  document.querySelectorAll('.titulo-h').forEach(e => e.style.zIndex = 30);
  { const e = document.getElementById('q2'); e.style.zIndex = 30; e.style.left = '50%'; e.style.top = '1330px'; }
  const T = [0, 5.55, 11.55, 16.35, 21.0, 36.25, 42.2, 46.1, 50.2, 57.5, 66.2, 72.7, 77.45];
  // centro de cada dia no calendário de parede (dezembro de 2026 começa numa terça)
  const centro = d => { const i = d + 1; return [150 + 28 + (i % 7) * 100 + 44, 640 + 190 + Math.floor(i / 7) * 100 + 44]; };

  window.render = function (t) {
    const cor = [COR.cta, COR.pessego, COR.verde, COR.cta, COR.pessego, COR.verde, COR.cta, COR.pessego, COR.verde, COR.cta, COR.verde, COR.pessego];
    for (let k = 1; k < T.length; k++) faixa(t, T[k], cor[k - 1], 'f' + k);
    // 1) dor: mercado na última hora
    cena('#merc', t, T[0], T[1], 0.01); camera('merc', t, T[0], T[1], 1.08, 1.0, -30, 0);
    animaBoneco('bM', t, { andar: t > 1.5 && t < 2.3 ? t : null, bE: 12, bD: 12, olhar: -0.6, inclina: t > 3 ? -6 : 0, fase: 1.3 });
    document.getElementById('merc-fila').style.transform = `translateX(${Math.sin(t * 1.3) * 6 + prog(t, 1.5, 2.3) * 20}px)`;
    entra('#merc-tag', t, 1.2, 1e9, { dy: 0, s0: 0.3, dur: 0.4, ease: E.back });
    animaTitulo('t1', t, 3.3, T[1] - 0.3);
    // 2) dúvidas
    cena('#lista', t, T[1], T[2], 0.01); camera('lista', t, T[1], T[2], 1.0, 1.08, 0, 20);
    document.getElementById('lista-papel').style.height = (E.out(prog(t, T[1] + 0.2, T[1] + 2.0)) * 760) + 'px';
    entra('#lista-q1', t, 6.13, 1e9, { dy: 0, s0: 0.2, dur: 0.35, ease: E.back, rot: -10 });
    entra('#lista-q2', t, 7.16, 1e9, { dy: 0, s0: 0.2, dur: 0.35, ease: E.back, rot: 8 });
    entra('#lista-q3', t, 9.9, 1e9, { dy: 0, s0: 0.2, dur: 0.35, ease: E.back, rot: 12 });
    entra('#lista-rel', t, T[1] + 0.4, 1e9, { dy: 30, s0: 0.6, dur: 0.4, ease: E.back });
    relogioPonteiros('lista', 6 + Math.max(0, t - T[1]) * 1.6);
    animaBoneco('bL', t, { bD: 60 + Math.sin(t * 3) * 8, bE: 10, olhar: 0.8, inclina: -6 + Math.sin(t * 2) * 3, fase: 0.7 });
    animaTitulo('t2', t, 5.71, T[2] - 0.3);
    entra('#q2', t, 8.38, T[2] - 0.3, { dy: 40, s0: 0.6, dur: 0.35, ease: E.back, base: 'translateX(-50%)', outDur: 0.2, dyOut: 0 });
    // 3) não é você
    cena('#sala', t, T[2], T[3], 0.01); camera('sala', t, T[2], T[3], 1.0, 1.08, 0, -10);
    animaBoneco('bS', t, { bD: 38, bE: 6, cel: 1, olhar: 0.3, inclina: 4 });
    animaTitulo('t3', t, 11.74, T[3] - 0.3);
    // 4) cada coisa no seu dia
    cena('#par', t, T[3], T[4], 0.01); camera('par', t, T[3], T[4], 1.0, 1.06, 0, 20);
    animaTitulo('t4', t, 18.83, T[4] - 0.3);
    // 5) o que vem no guia
    cena('#pdf', t, T[4], T[5], 0.01); camera('pdf', t, T[4], T[5], 1.0, 1.12, 0, -20);
    animaPDF('pdf', t, [21.5, 25.46, 32.24], T[4] + 0.1);
    animaTitulo('t5', t, T[4] + 0.1, T[5] - 0.3);
    // 6) cronograma: o mesmo calendário, com zoom no 17
    if (t >= T[5] - 0.3 && t < T[6]) {
      animaParede('par', t, -10);
      cena('#par', t, T[5], T[6], 0.01);
      const [cx, cy] = centro(17), z = E.inOut(prog(t, 39.8, 40.4));
      const c = document.getElementById('par-cam');
      c.style.transformOrigin = `${cx}px ${cy}px`;
      c.style.transform = `translateY(${z * 240}px) scale(${1 + z * 0.7})`;
    } else animaParede('par', t, 16.6);
    entra('#par-n17', t, 39.87, 1e9, { dy: 0, s0: 0.4, dur: 0.4, ease: E.back });
    animaBoneco('bP', t, { olhar: -0.8, bD: 0, bE: 30 + 10 * Math.sin(t * 2), inclina: -5 });
    animaTitulo('t6', t, 37.0, T[6] - 0.3);
    // 7) dia 21: geladeira
    cena('#gel', t, T[6], T[7], 0.01); camera('gel', t, T[6], T[7], 1.0, 1.06, 0, -10);
    const p = E.inOut(prog(t, 44.2, 45.3));
    const peru = document.getElementById('gel-peru');
    peru.style.transform = `translate(${Math.sin(p * Math.PI) * -60}px, ${p * 330}px) rotate(${Math.sin(p * Math.PI) * -12}deg)`;
    animaBoneco('bG', t, { olhar: -1, bE: 70 + p * 20, bD: 0, fase: 0.4 });
    animaTitulo('t7', t, T[6] + 0.1, T[7] - 0.3);
    // 8) dia 23: bancada
    cena('#ban', t, T[7], T[8], 0.01); camera('ban', t, T[7], T[8], 1.06, 1.0);
    [47.39, 48.14, 48.75].forEach((ti, i) => entra(`#ban-i${i}`, t, ti, 1e9, { dy: -160, s0: 0.6, dur: 0.45, ease: E.back }));
    animaTitulo('t8', t, 46.2, T[8] - 0.3);
    // 9) dia 24 hora a hora: 18h30
    cena('#coz', t, T[8], T[9], 0.01); camera('coz', t, T[8], T[9], 1.0, 1.1, -20, 0);
    relogioPonteiros('coz', 6.44 + prog(t, T[8], 54.43) * 0.06);
    document.getElementById('coz-brilho').style.opacity = 0.65 + 0.35 * Math.sin(t * 5);
    const anda = prog(t, 55.5, 56.5);
    document.getElementById('bK').style.transform = `translateX(${anda * 260}px)`;
    animaBoneco('bK', t, { andar: anda > 0 && anda < 1 ? t : null, bE: anda >= 1 ? 40 : 6, bD: anda >= 1 ? 40 : 6, olhar: anda > 0 ? 0.6 : -0.6, fase: 2.1 });
    animaTitulo('t9', t, 50.38, T[9] - 0.3);
    // 10) bônus
    cena('#bon', t, T[9], T[10], 0.01); camera('bon', t, T[9], T[10], 1.0, 1.06);
    [59.61, 62.17, 64.73].forEach((ti, i) => entra(`#bon-i${i}`, t, ti, 1e9, { dy: 140, s0: 0.5, dur: 0.45, ease: E.back }));
    animaTitulo('t10', t, 57.68, T[10] - 0.3);
    // 11) PDF no celular
    cena('#cel', t, T[10], T[11], 0.01); camera('cel', t, T[10], T[11], 1.04, 1.0);
    entra('#cel-tel', t, T[10] + 0.05, 1e9, { dy: 200, s0: 0.9, dur: 0.5, ease: E.back });
    entra('#cel-pdf', t, 66.74, 1e9, { dy: -300, s0: 1.6, dur: 0.5, ease: E.back });
    entra('#cel-toast', t, 69.95, 1e9, { dy: 40, s0: 0.8, dur: 0.35, ease: E.back });
    entra('#cel-dia', t, 1e9);
    animaBoneco('bC', t, { bD: 70, bE: 8, cel: 1, olhar: 0.6, fase: 0.9 });
    animaTitulo('t11', t, 66.35, T[11] - 0.3);
    // 12) garantia
    cena('#gar', t, T[11], T[12], 0.01); camera('gar', t, T[11], T[12], 1.0, 1.08);
    entra('#gar-ic', t, 73.5, 1e9, { dy: 0, s0: 0.3, dur: 0.5, ease: E.back });
    animaTitulo('t12', t, 72.86, T[12] - 0.3);
    // 13) oferta
    animaOferta('of', t, T[12], 77.61, 78.87, 79.9, 80.64);
  };
  window.render(0);
</script>
</body></html>
