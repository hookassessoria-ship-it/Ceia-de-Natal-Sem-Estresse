<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--creme); position: relative; }
  .topo { position:absolute; left:70px; right:70px; top:72px; }
  .topo .eyebrow { color: var(--vermelho); font-size: 26px; }
  h1 { font-family:'Serif'; font-weight:400; color: var(--verde); font-size: 112px; line-height: 0.98; margin-top: 16px; letter-spacing:-0.02em; }
  h1 em { font-style: italic; color: var(--vermelho); }
  .pg { position:absolute; right: 60px; top: 430px; width: 520px; transform: rotate(3deg); }
  .lista { position:absolute; left: 70px; top: 470px; width: 430px; }
  .lista .t { font-size: 27px; font-weight: 800; color: var(--dourado-escuro); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
  .r { background:#fff; border-radius: 18px; padding: 20px 22px; margin-bottom: 16px; box-shadow: 0 8px 20px rgba(27,56,32,.10); }
  .r b { display:block; font-size: 32px; font-weight: 800; color: var(--tinta); line-height: 1.2; }
  .r span { font-size: 25px; font-weight: 700; color: var(--verde-2); }
  .rodape { position:absolute; left:0; right:0; bottom:0; height: 140px; background: var(--verde); color:#fff; display:flex; align-items:center; justify-content:space-between; padding: 0 70px; }
  .rodape .a { font-size: 29px; font-weight: 800; }
  .rodape .a small { display:block; font-size: 24px; font-weight: 600; opacity: .8; margin-top: 4px; }
  .preco { background: var(--dourado); color: var(--verde); font-weight: 900; font-size: 40px; padding: 12px 28px; border-radius: 999px; }
</style></head>
<body>
  <div class="topo">
    <div class="eyebrow">E no dia 25?</div>
    <h1>E as sobras?<br><em>Tem receita pra isso.</em></h1>
  </div>
  <div class="lista">
    <div class="t">Bônus do guia</div>
    <div class="r"><b>Sanduíche de peru ou chester</b><span>15 min</span></div>
    <div class="r"><b>Risoto de aproveitamento</b><span>25 min</span></div>
    <div class="r"><b>Torta salgada de sobras</b><span>55 min</span></div>
    <div class="r"><b>Rabanada de panetone</b><span>25 min</span></div>
  </div>
  <div class="pg pagina"><img src="../../assets/site/guia-p057.webp"></div>
  <div class="rodape">
    <div class="a">+ como guardar e requentar com segurança<small>Ceia de Natal Sem Estresse · guia em PDF</small></div>
    <div class="preco">R$ 19,90</div>
  </div>
</body></html>
