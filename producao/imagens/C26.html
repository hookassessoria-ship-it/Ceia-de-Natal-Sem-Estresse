<html lang="pt-BR"><head><meta charset="utf-8"><meta name="formatos" content="45,916">
<link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="../objecoes.css">
<style>
  .zona { justify-content: space-between; align-items: center; text-align: center; }
  .titulo { font-size: 120px; }
  .mesa { position: relative; width: 760px; height: 420px; }
  .mesa::after { content:''; position:absolute; left: 6%; right: 6%; bottom: 8px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.55), rgba(0,0,0,0) 70%); filter: blur(6px); }
  .cartao { position:absolute; left: 70px; right: 70px; top: 40px; height: 300px; z-index: 2;

    box-shadow: 0 28px 50px rgba(0,0,0,.45), inset 0 -24px 30px rgba(160,120,70,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; transform: perspective(900px) rotateX(10deg); }
  .cartao::before { content:''; position:absolute; left: 22px; right: 22px; top: 22px; bottom: 22px; border: 2px solid var(--ouro); border-radius: 3px; }

  .cartao .q { font-family:'Serif'; font-style: italic; font-size: 64px; color: var(--verde-profundo); margin-top: 14px; }
  body.f916 .titulo { font-size: 128px; }
  body.f916 .mesa { transform: scale(1.08); }
</style></head>
