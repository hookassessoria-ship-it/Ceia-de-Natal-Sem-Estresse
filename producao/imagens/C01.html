<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--creme); position: relative; }
  .topo { position:absolute; left:0; right:0; top:0; height: 400px; padding: 78px 70px 0; }
  h1 { font-family:'Serif'; font-weight:400; color: var(--tinta); font-size: 104px; line-height: 0.98; letter-spacing:-0.02em; }
  .foto { top: 400px; background-image: url('../../assets/site/cozinha-baguncada.webp'); background-position: 40% 55%; }
  .resp { position:absolute; left: 70px; right: 70px; bottom: 70px; background: var(--creme); border-radius: 26px; padding: 36px 40px; box-shadow: 0 20px 50px rgba(0,0,0,.30); }
  .resp h2 { font-family:'Serif'; font-weight:400; color: var(--verde); font-size: 76px; line-height: 1; }
  .resp p { font-size: 30px; font-weight: 700; color: var(--tinta-2); margin-top: 14px; line-height: 1.3; }
  .resp .preco { position:absolute; right: 36px; top: -34px; background: var(--vermelho); color:#fff; font-weight: 900; font-size: 34px; padding: 12px 26px; border-radius: 999px; }
</style></head>
<body>
  <div class="topo"><h1>Passou a ceia inteira na cozinha?</h1></div>
  <div class="foto"></div>
  <div class="resp">
    <span class="preco">R$ 19,90</span>
    <h2>Este ano, sente à mesa.</h2>
    <p>Cardápio, lista de compras e cronograma prontos para 8 a 10 pessoas.</p>
  </div>
</body></html>
