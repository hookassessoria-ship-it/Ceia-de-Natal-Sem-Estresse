<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--verde); position: relative; color: #fff; }
  .foto { background-image: url('../../assets/site/hero-familia-1200.webp'); background-position: 50% 40%; filter: blur(6px) saturate(1.1); transform: scale(1.06); }
  .veu { position:absolute; inset:0; background: linear-gradient(180deg, rgba(27,56,32,.92) 0%, rgba(27,56,32,.70) 38%, rgba(27,56,32,.55) 70%, rgba(27,56,32,.92) 100%); }
  .topo { position:absolute; left:70px; right:70px; top:72px; }
  .topo .eyebrow { color: var(--dourado); font-size: 26px; }
  h1 { font-family:'Serif'; font-weight:400; font-size: 104px; line-height: 0.98; margin-top: 16px; letter-spacing:-0.02em; }
  .sub { font-size: 34px; font-weight: 700; margin-top: 16px; opacity: .92; }
  .cel { position:absolute; left: 560px; top: 420px; width: 400px; height: 790px; background: #111; border-radius: 56px; padding: 16px; box-shadow: 0 40px 80px rgba(0,0,0,.5); }
  .cel .tela { width:100%; height:100%; border-radius: 42px; overflow:hidden; background: var(--creme); }
  .cel .tela img { width: 172%; display:block; margin-left: -6%; margin-top: -8%; }
  .impresso { position:absolute; left: 90px; top: 520px; width: 420px; transform: rotate(-5deg); background:#fff; box-shadow: 0 24px 50px rgba(0,0,0,.4); }
  .impresso img { width:100%; display:block; }
  .fita { position:absolute; top: -18px; left: 50%; width: 140px; height: 40px; margin-left: -70px; background: rgba(235,214,160,.85); transform: rotate(2deg); }
  .rodape { position:absolute; left:70px; right:70px; bottom: 56px; display:flex; align-items:center; justify-content:space-between; }
  .rodape .a { font-size: 28px; font-weight: 800; line-height: 1.35; }
  .preco { background: var(--dourado); color: var(--verde); font-weight: 900; font-size: 40px; padding: 12px 28px; border-radius: 999px; }
</style></head>
<body>
  <div class="foto"></div><div class="veu"></div>
  <div class="topo">
    <div class="eyebrow">Ceia de Natal Sem Estresse</div>
    <h1>Seu guia da ceia no celular.</h1>
    <div class="sub">Ou impresso na porta da geladeira.</div>
  </div>
  <div class="impresso"><div class="fita"></div><img src="../../assets/site/guia-p012.webp"></div>
  <div class="cel"><div class="tela"><img src="../../assets/site/guia-p022.webp"></div></div>
  <div class="rodape">
    <div class="a">PDF de 63 páginas<br>acesso imediato por e-mail</div>
    <div class="preco">R$ 19,90</div>
  </div>
</body></html>
