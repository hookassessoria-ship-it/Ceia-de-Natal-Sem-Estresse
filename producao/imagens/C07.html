<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--creme); position: relative; }
  .foto { bottom: auto; height: 560px; background-image: url('../../assets/site/hero-familia-1200.webp'); background-position: 50% 40%; }
  .foto::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(254,247,236,1) 100%); }
  .bloco { position:absolute; left:70px; right:70px; top: 470px; }
  h1 { font-family:'Serif'; font-weight:400; color: var(--verde); font-size: 98px; line-height: 0.98; letter-spacing:-0.02em; }
  .sub { font-size: 30px; font-weight: 700; color: var(--tinta-2); margin-top: 16px; }
  .tabela { position:absolute; left:70px; right:70px; top: 790px; background:#fff; border-radius: 22px; padding: 14px 34px; box-shadow: 0 12px 30px rgba(27,56,32,.12); }
  .lin { display:flex; justify-content:space-between; align-items:baseline; padding: 15px 0; border-bottom: 2px dashed #eadfca; font-size: 31px; }
  .lin:last-child { border-bottom: 0; }
  .lin span { font-weight: 700; color: var(--tinta); display:flex; align-items:center; gap: 14px; }
  .lin span i { width: 28px; height: 28px; border: 3px solid var(--verde); border-radius: 6px; display:inline-block; }
  .lin b { font-weight: 900; color: var(--vermelho); }
  .fonte { position:absolute; left:70px; right:70px; top: 1222px; font-size: 22px; color: var(--tinta-2); font-weight: 600; }
  .preco { position:absolute; right: 70px; top: 1196px; background: var(--verde); color: #fff; font-weight: 900; font-size: 36px; padding: 12px 26px; border-radius: 999px; }
</style></head>
<body>
  <div class="foto"></div>
  <div class="bloco">
    <h1>Quanto comprar pra 10 pessoas?</h1>
    <div class="sub">O guia já traz as quantidades. Um trecho:</div>
  </div>
  <div class="tabela">
    <div class="lin"><span><i></i>Chester</span><b>1, de cerca de 3,5 kg</b></div>
    <div class="lin"><span><i></i>Batata</span><b>1,5 kg</b></div>
    <div class="lin"><span><i></i>Arroz</span><b>1 pacote (1 kg)</b></div>
    <div class="lin"><span><i></i>Farinha de mandioca torrada</span><b>500 g</b></div>
    <div class="lin"><span><i></i>Creme de leite</span><b>4 caixinhas</b></div>
  </div>
  <div class="fonte">Lista do cardápio Econômico,<br>para 8 a 10 pessoas.</div>
  <div class="preco">Guia completo: R$ 19,90</div>
</body></html>
