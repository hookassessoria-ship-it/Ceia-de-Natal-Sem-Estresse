<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--creme-2); position: relative; }
  .topo { position:absolute; left:70px; right:70px; top:70px; }
  .topo .eyebrow { color: var(--vermelho); font-size: 26px; }
  h1 { font-family:'Serif'; font-weight:400; color: var(--verde); font-size: 86px; line-height: 1.0; margin-top: 16px; letter-spacing:-0.015em; }
  .pg { position:absolute; left: 70px; top: 430px; width: 590px; transform: rotate(-2deg); }
  .secoes { position:absolute; right: 56px; top: 440px; width: 330px; display:flex; flex-direction:column; gap: 16px; }
  .sec { background:#fff; border-radius: 16px; padding: 16px 20px; font-weight: 800; font-size: 27px; color: var(--verde); display:flex; align-items:center; gap: 14px; box-shadow: 0 8px 20px rgba(27,56,32,.10); }
  .ck { width: 34px; height: 34px; border-radius: 8px; background: var(--verde); color: #fff; display:flex; align-items:center; justify-content:center; font-size: 24px; flex: 0 0 34px; }
  .nota { margin-top: 10px; font-family:'Hand'; font-size: 46px; color: var(--vermelho); line-height: 1.0; transform: rotate(-3deg); padding-left: 8px; }
  .rodape { position:absolute; left:0; right:0; bottom:0; height: 140px; background: var(--verde); color:#fff; display:flex; align-items:center; justify-content:space-between; padding: 0 70px; }
  .rodape .a { font-size: 30px; font-weight: 800; }
  .rodape .a small { display:block; font-size: 24px; font-weight: 600; opacity: .8; margin-top: 4px; }
  .preco { background: var(--dourado); color: var(--verde); font-weight: 900; font-size: 40px; padding: 12px 28px; border-radius: 999px; }
</style></head>
<body>
  <div class="topo">
    <div class="eyebrow">Para cada um dos 3 cardápios</div>
    <h1>Lista de compras pronta, por seção do mercado.</h1>
  </div>
  <div class="pg pagina"><img src="../../assets/site/guia-p012.webp"></div>
  <div class="secoes">
    <div class="sec"><span class="ck">✓</span>Hortifrúti</div>
    <div class="sec"><span class="ck">✓</span>Açougue</div>
    <div class="sec"><span class="ck">✓</span>Frios e laticínios</div>
    <div class="sec"><span class="ck">✓</span>Mercearia</div>
    <div class="sec"><span class="ck">✓</span>Temperos</div>
    <div class="nota">com as quantidades<br>para 8 a 10 pessoas</div>
  </div>
  <div class="rodape">
    <div class="a">Ceia de Natal Sem Estresse<small>Guia em PDF · 63 páginas · imprima e risque no mercado</small></div>
    <div class="preco">R$ 19,90</div>
  </div>
</body></html>
