<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<style>
  body { width:1080px; height:1350px; background: var(--creme); position: relative; }
  .foto { bottom: auto; height: 700px; background-image: url('../../assets/site/descanso-meias.webp'); background-position: 50% 60%; }
  .selo { position:absolute; right: 70px; top: 590px; width: 230px; height: 230px; border-radius: 50%; background: var(--verde); color: #fff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow: 0 16px 36px rgba(0,0,0,.28); border: 6px solid var(--dourado); }
  .selo b { font-family:'Serif'; font-weight:400; font-size: 96px; line-height: .9; }
  .selo span { font-size: 19px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; text-align:center; line-height: 1.15; margin-top: 6px; }
  .bloco { position:absolute; left:70px; right:70px; top: 760px; }
  h1 { font-family:'Serif'; font-weight:400; color: var(--verde); font-size: 104px; line-height: 0.98; letter-spacing:-0.02em; }
  h1 em { font-style: italic; color: var(--vermelho); }
  .det { font-size: 29px; font-weight: 700; color: var(--tinta-2); margin-top: 22px; line-height: 1.35; max-width: 900px; }
  .rodape { position:absolute; left:0; right:0; bottom:0; height: 130px; background: var(--verde); color:#fff; display:flex; align-items:center; justify-content:space-between; padding: 0 70px; }
  .rodape .a { font-size: 28px; font-weight: 800; }
  .rodape .a small { display:block; font-size: 23px; font-weight: 600; opacity: .8; margin-top: 4px; }
  .preco { background: var(--dourado); color: var(--verde); font-weight: 900; font-size: 40px; padding: 12px 28px; border-radius: 999px; }
</style></head>
<body>
  <div class="foto"></div>
  <div class="selo"><b>7</b><span>dias de<br>garantia</span></div>
  <div class="bloco">
    <h1>Teste por 7 dias.<br><em>Se não gostar, devolvemos.</em></h1>
    <div class="det">Peça o reembolso pelo e-mail em até 7 dias após a compra e você recebe o valor integral de volta.</div>
  </div>
  <div class="rodape">
    <div class="a">Ceia de Natal Sem Estresse · Cantinho do Lar<small>Guia em PDF · 63 páginas · acesso imediato por e-mail</small></div>
    <div class="preco">R$ 19,90</div>
  </div>
</body></html>
